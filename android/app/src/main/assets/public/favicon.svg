<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF08A" />
      <stop offset="0.35" stop-color="#F59E0B" />
      <stop offset="0.75" stop-color="#D97706" />
      <stop offset="1" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="0.5" stop-color="#94A3B8" />
      <stop offset="1" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <path id="topArc" d="M 28 64 A 36 36 0 0 1 100 64" fill="none" />
    <path id="bottomArc" d="M 100 64 A 36 36 0 0 1 28 64" fill="none" />
  </defs>

  <!-- Outer Chrome/Gold Bevel Rings -->
  <circle cx="64" cy="64" r="62" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#silverGrad)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="64" cy="64" r="48" fill="#090d16" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Arched Text: GREATSTAR on top interior -->
  <text font-family="'Chakra Petch', sans-serif" font-weight="900" font-size="10.5" fill="url(#goldGrad)" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">GREATSTAR</textPath>
  </text>

  <!-- Center 3D Wings and Automotive Star -->
  <path d="M22 64C36 57 50 53 64 53C78 53 92 57 106 64C94 69 79 72 64 72C49 72 34 69 22 64Z" fill="url(#silverGrad)" opacity="0.4"/>
  <path d="M24 63C37 57 50 54 64 54C78 54 91 57 104 63" stroke="url(#silverGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M30 67C41 63 52 61 64 61C76 61 87 63 98 67" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 3D Multi-faceted Gold Star -->
  <polygon points="64,36 67.5,58 79,64 67.5,70 64,88 60.5,70 49,64 60.5,58" fill="url(#goldGrad)"/>
  <circle cx="64" cy="64" r="3" fill="#FFFFFF"/>

  <!-- Bottom Text: Z.N.W on bottom interior -->
  <text font-family="'Chakra Petch', sans-serif" font-weight="900" font-size="9" fill="url(#goldGrad)" letter-spacing="3">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">Z.N.W</textPath>
  </text>
</svg>
