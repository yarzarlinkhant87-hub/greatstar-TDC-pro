name: Build Android APK (GreatStar DTC-PRO)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android Platform Exists & Sync
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found, adding android platform..."
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload GreatStar DTC-PRO APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreatStar-ZNW-DTC-PRO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
