name: Build Android APK (GreatStar DTC-PRO)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Ensure Android Platform Exists & Sync
        run: |
          if [ ! -d "android" ]; then
            echo "Creating android platform folder..."
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload GreatStar DTC-PRO APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreatStar-ZNW-DTC-PRO-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
